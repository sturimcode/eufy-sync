name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # No `if:` here. Skipping this step on a manual dispatch meant the one
      # check that keeps the tag, pyproject.toml, and __version__ agreeing was
      # skipped exactly when nothing else was enforcing it. A non-tag ref has no
      # version to check against, so it stops here instead of publishing.
      - name: Verify tag matches package version
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              echo "Publishing only runs from a version tag; $GITHUB_REF is not one. Dispatch this workflow from a tag, not a branch."
              exit 1
              ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          dunder=$(grep -E '^__version__ = ' eufy_sync/__init__.py | sed -E 's/__version__ = "(.*)"/\1/')
          if [ "$tag" != "$ver" ]; then
            echo "Tag $GITHUB_REF_NAME ($tag) does not match pyproject.toml version ($ver). Refusing to publish."
            exit 1
          fi
          if [ "$tag" != "$dunder" ]; then
            echo "Tag $GITHUB_REF_NAME ($tag) does not match eufy_sync/__init__.py __version__ ($dunder). Refusing to publish."
            exit 1
          fi
          echo "Tag and package versions agree: $ver"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create or finish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep existing notes when retrying a release that already exists.
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'); then
            if [ "$draft" = true ]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            else
              echo "Release $GITHUB_REF_NAME is already published."
            fi
            exit 0
          fi
          subject=$(git log -1 --format=%s)
          desc=$(printf '%s' "$subject" | sed -E 's/ \(#[0-9]+\)$//' | sed -E 's/; [0-9]+(\.[0-9]+)*$//')
          title="$GITHUB_REF_NAME"
          if [ -n "$desc" ]; then
            title="$GITHUB_REF_NAME - $desc"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$title"
