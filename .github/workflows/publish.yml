name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  # Tests do not run on tag pushes (test.yml triggers on main and pull
  # requests), so without this job a tag could publish code that never went
  # green on any runner. Mirrors test.yml's matrix and steps.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . && pip install pytest
      - run: pytest tests/ -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # No `if:` here. Skipping this step on a manual dispatch meant the one
      # check that keeps the tag, pyproject.toml, and __version__ agreeing was
      # skipped exactly when nothing else was enforcing it. A non-tag ref has no
      # version to check against, so it stops here instead of publishing.
      - name: Verify tag matches package version
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) ;;
            *)
              echo "Publishing only runs from a version tag; $GITHUB_REF is not one. Dispatch this workflow from a tag, not a branch."
              exit 1
              ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          dunder=$(grep -E '^__version__ = ' eufy_sync/__init__.py | sed -E 's/__version__ = "(.*)"/\1/')
          if [ "$tag" != "$ver" ]; then
            echo "Tag $GITHUB_REF_NAME ($tag) does not match pyproject.toml version ($ver). Refusing to publish."
            exit 1
          fi
          if [ "$tag" != "$dunder" ]; then
            echo "Tag $GITHUB_REF_NAME ($tag) does not match eufy_sync/__init__.py __version__ ($dunder). Refusing to publish."
            exit 1
          fi
          echo "Tag and package versions agree: $ver"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
      # The tag guard above already fails every non-tag ref, so this `if:` is
      # unreachable in practice. It stays because it states the requirement at
      # the step that depends on it: there is no release to create without a tag.
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # Title the release "vX.Y.Z - <commit subject>", dropping the PR number
        # and any trailing "; X.Y.Z" from squash-merge subjects. Falls back to
        # the bare tag if nothing readable is left.
        run: |
          subject=$(git log -1 --format=%s)
          desc=$(printf '%s' "$subject" | sed -E 's/ \(#[0-9]+\)$//' | sed -E 's/; [0-9]+(\.[0-9]+)*$//')
          title="$GITHUB_REF_NAME"
          if [ -n "$desc" ]; then
            title="$GITHUB_REF_NAME - $desc"
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$title"
