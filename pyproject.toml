[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eufy-garmin-sync"
version = "1.0.0"
description = "Sync Eufy smart scale body composition data to Garmin Connect"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "playwright>=1.40.0",
    "pyyaml>=6.0",
]

[project.scripts]
eufy-sync = "eufy_garmin_sync.cli:main"

[project.urls]
Repository = "https://github.com/sturimcode/eufy-garmin-sync"

[tool.setuptools.packages.find]
include = ["eufy_garmin_sync*"]
