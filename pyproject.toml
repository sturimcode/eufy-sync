[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eufy-sync"
version = "1.11.0"
description = "Sync Eufy smart scale body composition data to Garmin Connect and Strava"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "garmin",
    "garmin connect",
    "strava",
    "eufy",
    "eufylife",
    "smart scale",
    "body composition",
    "fit file",
    "weight sync",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "garminconnect>=0.3.10",
    "curl_cffi>=0.15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The browser fallback for a rate-limited Garmin login. Opt-in: Playwright is
# several times the size of everything else, and most installs never need it.
browser = ["playwright>=1.40.0"]

[project.scripts]
eufy-sync = "eufy_sync.cli:main"

[project.urls]
Homepage = "https://github.com/sturimcode/eufy-sync"
Repository = "https://github.com/sturimcode/eufy-sync"
Issues = "https://github.com/sturimcode/eufy-sync/issues"
Funding = "https://ko-fi.com/sturim"

[tool.setuptools.packages.find]
include = ["eufy_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Correctness and import hygiene only. Style rules that would rewrite working
# code for no behavior gain stay off.
select = ["F", "E4", "E7", "E9", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["eufy_sync"]
